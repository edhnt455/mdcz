name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliyun-acr-${{ github.ref }}
  cancel-in-progress: true

env:
  ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
  IMAGE_NAME: mdcz

jobs:
  publish:
    name: Build and push Aliyun ACR image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate registry configuration
        shell: bash
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          : "${ALIYUN_REGISTRY:?Set the ALIYUN_REGISTRY repository variable}"
          : "${ALIYUN_NAMESPACE:?Set the ALIYUN_NAMESPACE repository variable}"
          : "${ALIYUN_USERNAME:?Set the ALIYUN_USERNAME repository secret}"
          : "${ALIYUN_PASSWORD:?Set the ALIYUN_PASSWORD repository secret}"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*)(\.([0-9]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*))*)?$ ]] || (( ${#version} > 128 )); then
            echo "VERSION must contain a Docker-tag-compatible semantic version, got: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}

      - name: Build and push x86 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            MDCZ_RELEASE_VERSION=${{ steps.version.outputs.value }}
            MDCZ_REVISION=${{ steps.version.outputs.revision }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
